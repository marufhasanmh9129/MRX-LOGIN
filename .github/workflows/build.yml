name: Build MRX-LOGIN
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Check packaged resources
        run: |
          test -s target/MRX-LOGIN.jar
          jar tf target/MRX-LOGIN.jar > /tmp/jar-files.txt
          grep -qx 'plugin.yml' /tmp/jar-files.txt
          grep -qx 'config.yml' /tmp/jar-files.txt
          grep -qx 'messages.yml' /tmp/jar-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MRX-LOGIN
          path: target/MRX-LOGIN.jar
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MRX-LOGIN
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/MRX-LOGIN.jar
          generate_release_notes: true
